# shellcheck shell=bash disable=SC2034
# vi:ft=sh

# system
SYSTEMD_EDITOR=vim
ENV_D=1
EDITOR=vim
# VISUAL=neovide
MOZ_ENABLE_WAYLAND=1

# qol
FZF_LAYOUT="--border=rounded"
FZF_DEFAULT_OPTS="--keep-right --info=inline --bind=ctrl-z:ignore,btab:up,tab:down $FZF_LAYOUT"
_ZO_FZF_OPTS="$FZF_DEFAULT_OPTS --height=40% --exact --no-sort --cycle --tabstop=1 --exit-0 --layout=reverse"
_ZO_RESOLVE_SYMLINKS=0
BAT_THEME=GitHub

# Config overrides
FNM_PATH="${XDG_DATA_HOME:-${HOME}/.local/share}"/fnm
NPM_CONFIG_CACHE="${XDG_DATA_HOME:-${HOME}/.local/share}"/npm
NPM_CONFIG_USERCONFIG="${XDG_CONFIG_HOME:-${HOME}/.config}"/.npmrc
YARN_CACHE_FOLDER="${XDG_DATA_HOME:-${HOME}/.local/share}"/yarn
VSCODE_EXTENSIONS="${XDG_DATA_HOME:-${HOME}/.local/share}"/vscode-extensions
BUN_INSTALL="${XDG_DATA_HOME:-${HOME}/.local/share}"/bun
BIOME_CONFIG_PATH="${XDG_CONFIG_HOME:-${HOME}/.config}"/biome/biome.json
RIPGREP_CONFIG_PATH="${XDG_CONFIG_HOME:-${HOME}/.config}"/ripgreprc
CODEX_HOME="${XDG_CONFIG_HOME:-${HOME}/.config}"/codex
CLAUDE_CONFIG_DIR="${XDG_CONFIG_HOME:-${HOME}/.config}"/claude
PI_CODING_AGENT_DIR="${XDG_CONFIG_HOME:-${HOME}/.config}"/pi/agent
UV_EXCLUDE_NEWER="P3D"

# QT
# Use one only or per package
# QT_FONT_DPI=115
# QT_SCALE_FACTOR=1.2

# docker
DOCKER_HOST=unix:///run/user/1000/podman/podman.sock
DOCKER_CONFIG="${XDG_DATA_HOME:-${HOME}/.local/share}"/docker
PODMAN_COMPOSE_WARNING_LOGS=false

# R
R_LIBS_USER=~/.local/lib/R/library
R_LIBS_SITE=/usr/local/lib/R/site-library:/usr/local/lib/R/library:/usr/lib64/R/library:/usr/share/R/library
R_PROFILE_USER=~/.config/Rprofile
R_ENVIRON_USER=~/.config/Renviron
R_LINTR_LINTER_FILE=~/.config/lintr

# pkgconfig
PKG_CONFIG_PATH=/usr/bin/pkgconfig:/usr/bin/x86_64-redhat-linux-gnu-pkg-config
