# ── Paths ──────────────────────────────────────────────
dir=~/Downloads/Torrents
input-file=~/.config/aria2/aria2.session
save-session=~/.config/aria2/aria2.session
save-session-interval=60         # save session every 60s (resume on crash)

# ── BitTorrent / Seeding ────────────────────────────────
enable-dht=true
enable-peer-exchange=true
bt-enable-lpd=true               # Local Peer Discovery
listen-port=6881-6889
dht-listen-port=6881-6889
bt-save-metadata=true            # saves .torrent from magnets
bt-seed-unverified=false         # only seed after hash verify
seed-ratio=2.0                   # seed until 2.0 ratio (adjust to taste)
seed-time=10080                  # max seed time in minutes (7 days), 0 = unlimited

# ── Performance ─────────────────────────────────────────
max-concurrent-downloads=3
max-connection-per-server=4
split=4
min-split-size=5M
max-overall-download-limit=0     # 0 = unlimited
max-overall-upload-limit=0       # 0 = unlimited; set e.g. 500K to cap

# ── RPC (optional, for monitoring) ──────────────────────
enable-rpc=true
rpc-listen-all=false             # localhost only for security
rpc-listen-port=6800
rpc-secret=CHANGE_THIS_SECRET    # set a real secret

# ── Misc ────────────────────────────────────────────────
log=~/.config/aria2/aria2.log
log-level=notice
continue=true
