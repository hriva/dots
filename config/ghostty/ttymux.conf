# ghostty.conf: the tmux.conf window/pane/copy workflow, ported to Ghostty 1.3.1.
#
# Loaded from ~/.config/ghostty/config. Relative config-file paths resolve
# from ~/.config/ghostty/, so the bare file name is enough.
#
# Mapping:
#   tmux prefix C-g            -> ctrl+g> sequence leader
#   tmux prefix-table keys     -> ctrl+g>KEY, one action, then back to normal
#   tmux switch-client -T      -> key tables: pane, tab, resize, session
#   tmux copy-mode-vi          -> key table: copy-mode (scroll + search only)
#   tmux root (bind -n) M-*    -> plain alt+KEY bindings
#
# Gaps (no Ghostty 1.3.1 equivalent):
#   - Keyboard selection. adjust_selection does nothing without an existing
#     selection and no action starts one, so v/Space/V cannot begin a
#     selection. Select with the mouse, then y or Enter copies it.
#   - Cursor motions (h/l/w/b/0/$/H/M/L), marks, jump-to-char. Scrollback has
#     no cursor, so h/l are swallowed in copy-mode.
#   - swap-pane, break-pane, synchronize-panes, layout cycling, floating panes,
#     detach. prefix m (move mode) is therefore left unbound.

# ---------------------------------------------------------------
# Prefix: ctrl+g (tmux.conf: set -g prefix C-g)
# Ghostty waits indefinitely for the next key, like tmux's prefix. An unbound
# key after the prefix is dropped rather than sent to the shell, matching tmux.
# ---------------------------------------------------------------
keybind = ctrl+g>catch_all=ignore

# --- Mode entry points (tmux.conf prefix bindings) ---
keybind = ctrl+g>p=activate_key_table:pane
keybind = ctrl+g>t=activate_key_table:tab
keybind = ctrl+g>r=activate_key_table:resize
keybind = ctrl+g>o=activate_key_table:session
keybind = ctrl+g>s=activate_key_table:copy-mode
# tmux default prefix [ and PageUp also enter copy-mode, so keep them.
keybind = ctrl+g>[=activate_key_table:copy-mode
keybind = ctrl+g>page_up=activate_key_table:copy-mode
keybind = chain=scroll_page_up

# --- tmux default prefix bindings that tmux.conf does not override ---
# Splits: " is a vertical split (pane below), % is a horizontal split (pane right).
keybind = ctrl+g>"=new_split:down
keybind = ctrl+g>%=new_split:right
keybind = ctrl+g>arrow_up=goto_split:up
keybind = ctrl+g>arrow_down=goto_split:down
keybind = ctrl+g>arrow_left=goto_split:left
keybind = ctrl+g>arrow_right=goto_split:right
# last-pane. Approximation: Ghostty "previous" follows creation order, not last-used.
keybind = ctrl+g>;=goto_split:previous
keybind = ctrl+g>x=close_surface
keybind = ctrl+g>z=toggle_split_zoom
keybind = ctrl+g>shift+e=equalize_splits
# Windows are tabs in Ghostty.
keybind = ctrl+g>c=new_tab
keybind = ctrl+g>n=next_tab
keybind = ctrl+g>l=last_tab
keybind = ctrl+g>&=close_tab:this
keybind = ctrl+g>,=prompt_tab_title
keybind = ctrl+g>w=toggle_tab_overview
keybind = ctrl+g>1=goto_tab:1
keybind = ctrl+g>2=goto_tab:2
keybind = ctrl+g>3=goto_tab:3
keybind = ctrl+g>4=goto_tab:4
keybind = ctrl+g>5=goto_tab:5
keybind = ctrl+g>6=goto_tab:6
keybind = ctrl+g>7=goto_tab:7
keybind = ctrl+g>8=goto_tab:8
keybind = ctrl+g>9=goto_tab:9
# Approximations: command prompt -> command palette; paste buffer -> clipboard.
keybind = ctrl+g>:=toggle_command_palette
keybind = ctrl+g>]=paste_from_clipboard

# ---------------------------------------------------------------
# Pane table (tmux.conf zj-pane). Navigation keeps the table open, like the
# tmux.conf re-entry. Splits, close, and zoom return to normal.
# ---------------------------------------------------------------
keybind = pane/catch_all=deactivate_key_table
keybind = pane/arrow_left=goto_split:left
keybind = pane/arrow_down=goto_split:down
keybind = pane/arrow_up=goto_split:up
keybind = pane/arrow_right=goto_split:right
keybind = pane/h=goto_split:left
keybind = pane/j=goto_split:down
keybind = pane/k=goto_split:up
keybind = pane/l=goto_split:right
keybind = pane/;=goto_split:previous
keybind = pane/tab=goto_split:next
keybind = pane/c=prompt_surface_title
keybind = chain=deactivate_key_table
keybind = pane/d=new_split:down
keybind = chain=deactivate_key_table
keybind = pane/n=new_split:down
keybind = chain=deactivate_key_table
keybind = pane/r=new_split:right
keybind = chain=deactivate_key_table
# tmux.conf: "s" is a stacked layout, approximated as a vertical split.
keybind = pane/s=new_split:down
keybind = chain=deactivate_key_table
keybind = pane/x=close_surface
keybind = chain=deactivate_key_table
keybind = pane/f=toggle_split_zoom
keybind = chain=deactivate_key_table
keybind = pane/p=deactivate_key_table
keybind = pane/escape=deactivate_key_table
keybind = pane/enter=deactivate_key_table

# ---------------------------------------------------------------
# Tab table (tmux.conf zj-tab). Previous/next keep the table open.
# Numbers, new, close, rename return to normal.
# ---------------------------------------------------------------
keybind = tab/catch_all=deactivate_key_table
keybind = tab/arrow_left=previous_tab
keybind = tab/arrow_up=previous_tab
keybind = tab/h=previous_tab
keybind = tab/k=previous_tab
keybind = tab/arrow_right=next_tab
keybind = tab/arrow_down=next_tab
keybind = tab/l=next_tab
keybind = tab/j=next_tab
keybind = tab/tab=last_tab
keybind = tab/1=goto_tab:1
keybind = chain=deactivate_key_table
keybind = tab/2=goto_tab:2
keybind = chain=deactivate_key_table
keybind = tab/3=goto_tab:3
keybind = chain=deactivate_key_table
keybind = tab/4=goto_tab:4
keybind = chain=deactivate_key_table
keybind = tab/5=goto_tab:5
keybind = chain=deactivate_key_table
keybind = tab/6=goto_tab:6
keybind = chain=deactivate_key_table
keybind = tab/7=goto_tab:7
keybind = chain=deactivate_key_table
keybind = tab/8=goto_tab:8
keybind = chain=deactivate_key_table
keybind = tab/9=goto_tab:9
keybind = chain=deactivate_key_table
keybind = tab/n=new_tab
keybind = chain=deactivate_key_table
keybind = tab/x=close_tab:this
keybind = chain=deactivate_key_table
keybind = tab/r=prompt_tab_title
keybind = chain=deactivate_key_table
keybind = tab/t=deactivate_key_table
keybind = tab/escape=deactivate_key_table
keybind = tab/enter=deactivate_key_table

# ---------------------------------------------------------------
# Resize table (tmux.conf zj-resize). Stays open while resizing.
# tmux resize-pane 3 cells -> resize_split 30px (horizontal) / 60px (vertical).
# These pixel values are a guess at ~3 cells for this font. Tune them.
# shift+hjkl mirror tmux.conf: H grows right, J grows up, K grows down, L grows left.
# ---------------------------------------------------------------
keybind = resize/catch_all=deactivate_key_table
keybind = resize/arrow_left=resize_split:left,30
keybind = resize/arrow_down=resize_split:down,60
keybind = resize/arrow_up=resize_split:up,60
keybind = resize/arrow_right=resize_split:right,30
keybind = resize/h=resize_split:left,30
keybind = resize/j=resize_split:down,60
keybind = resize/k=resize_split:up,60
keybind = resize/l=resize_split:right,30
keybind = resize/shift+h=resize_split:right,30
keybind = resize/shift+j=resize_split:up,60
keybind = resize/shift+k=resize_split:down,60
keybind = resize/shift+l=resize_split:left,30
# + and = grow both axes; - shrinks both (tmux.conf runs two resize commands).
keybind = resize/+=resize_split:right,30
keybind = chain=resize_split:down,60
keybind = resize/==resize_split:right,30
keybind = chain=resize_split:down,60
keybind = resize/-=resize_split:left,30
keybind = chain=resize_split:up,60
keybind = resize/r=deactivate_key_table
keybind = resize/escape=deactivate_key_table
keybind = resize/enter=deactivate_key_table

# ---------------------------------------------------------------
# Session table (tmux.conf zj-session). Only the actions with a Ghostty
# equivalent. d (detach) has none, so it falls through to catch_all.
# ---------------------------------------------------------------
keybind = session/catch_all=deactivate_key_table
keybind = session/w=toggle_tab_overview
keybind = chain=deactivate_key_table
keybind = session/c=reload_config
keybind = chain=deactivate_key_table
keybind = session/f=toggle_split_zoom
keybind = chain=deactivate_key_table
keybind = session/o=deactivate_key_table
keybind = session/escape=deactivate_key_table
keybind = session/enter=deactivate_key_table

# ---------------------------------------------------------------
# Copy-mode table (tmux copy-mode-vi). Scroll and search only; see Gaps.
# catch_all=ignore: unbound keys are swallowed and the mode stays open, as in
# tmux copy-mode, so a stray key never reaches the shell.
# ---------------------------------------------------------------
keybind = copy-mode/catch_all=ignore

# Scroll. j/k scroll one line because there is no visible cursor to move.
keybind = copy-mode/j=scroll_page_lines:1
keybind = copy-mode/k=scroll_page_lines:-1
keybind = copy-mode/arrow_down=scroll_page_lines:1
keybind = copy-mode/arrow_up=scroll_page_lines:-1
keybind = copy-mode/ctrl+e=scroll_page_lines:1
keybind = copy-mode/ctrl+y=scroll_page_lines:-1
keybind = copy-mode/d=scroll_page_fractional:0.5
keybind = copy-mode/u=scroll_page_fractional:-0.5
keybind = copy-mode/ctrl+d=scroll_page_fractional:0.5
keybind = copy-mode/ctrl+u=scroll_page_fractional:-0.5
keybind = copy-mode/ctrl+f=scroll_page_down
keybind = copy-mode/ctrl+b=scroll_page_up
keybind = copy-mode/page_down=scroll_page_down
keybind = copy-mode/page_up=scroll_page_up
keybind = copy-mode/g=scroll_to_top
keybind = copy-mode/shift+g=scroll_to_bottom

# Search. Ghostty has one search direction, so / ? and f all open the search bar.
keybind = copy-mode/f=start_search
keybind = copy-mode//=start_search
keybind = copy-mode/?=start_search
keybind = copy-mode/n=navigate_search:next
keybind = copy-mode/shift+n=navigate_search:previous

# Copy: copy the mouse selection, then leave copy-mode (copy-selection-and-cancel).
# copy_to_clipboard does nothing without a selection, so these still exit.
keybind = copy-mode/y=copy_to_clipboard
keybind = chain=end_search
keybind = chain=deactivate_key_table
keybind = copy-mode/enter=copy_to_clipboard
keybind = chain=end_search
keybind = chain=deactivate_key_table
# tmux.conf "e" dumps scrollback for editing. Ghostty opens it with xdg-open.
keybind = copy-mode/e=write_scrollback_file:open

# Exit (tmux.conf s, q, Escape, and Ctrl-c cancel copy-mode).
keybind = copy-mode/s=end_search
keybind = chain=deactivate_key_table
keybind = copy-mode/q=end_search
keybind = chain=deactivate_key_table
keybind = copy-mode/escape=end_search
keybind = chain=deactivate_key_table
keybind = copy-mode/ctrl+c=end_search
keybind = chain=deactivate_key_table

# ---------------------------------------------------------------
# Root (no prefix): tmux.conf bind -n block.
# ---------------------------------------------------------------
keybind = alt+arrow_left=goto_split:left
keybind = alt+arrow_down=goto_split:down
keybind = alt+arrow_up=goto_split:up
keybind = alt+arrow_right=goto_split:right
keybind = alt+h=goto_split:left
keybind = alt+j=goto_split:down
keybind = alt+k=goto_split:up
keybind = alt+l=goto_split:right
keybind = alt+n=new_split:down
keybind = alt+shift+n=new_split:right
# Move tab left/right. Ghostty wraps around at the ends; tmux swap-window does not.
keybind = alt+i=move_tab:-1
keybind = alt+o=move_tab:1
# Grow both axes on + and =; shrink both on -.
keybind = alt++=resize_split:right,30
keybind = chain=resize_split:down,60
keybind = alt+==resize_split:right,30
keybind = chain=resize_split:down,60
keybind = alt+-=resize_split:left,30
keybind = chain=resize_split:up,60
# tmux M-[ and M-] cycle layouts. Ghostty has no cycling, so both equalize.
keybind = alt+[=equalize_splits
keybind = alt+]=equalize_splits
# M-g (floating popup) is left unbound. Ghostty's quick terminal does not
# work on GNOME Wayland, and Ghostty has no floating panes.
