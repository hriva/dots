####################################################################
# tmux.conf — reimplementation of the Zellij "locked-mode" workflow
####################################################################
#
# Mapping model:
#   Zellij "locked" mode (default_mode "locked")  == tmux's normal
#     passthrough state. Keys go straight to the program in the pane.
#     No config needed for this — it's how tmux already behaves.
#   Zellij "Ctrl g" (locked -> normal)             == tmux's prefix key.
#     Below, prefix is remapped to Ctrl-g to match muscle memory.
#   Zellij's second-level modes (pane/tab/resize/move/scroll/session)
#     == tmux "key tables". prefix + <letter> switches into a table;
#     one action runs and tmux auto-returns to the root table — this
#     mirrors Zellij's "SwitchToMode locked" after each action.
#   Where Zellij keeps you *inside* a mode for repeated presses
#     (arrow/hjkl navigation, resize, move), each binding below
#     re-enters its own table (`switch-client -T <table>`) so you can
#     keep pressing without the prefix, exactly like the source config.
#
# Requires tmux >= 3.2 for a couple of bindings (display-popup,
# command-prompt -T). Run `tmux -V` to check.

# ---------------------------------------------------------------
# Prefix: Ctrl-g, replacing Zellij's Ctrl-g unlock key
# ---------------------------------------------------------------
unbind C-b
set -g prefix C-g
# Uncomment to also keep the tmux default prefix as a fallback:
# set -g prefix2 C-b
# bind-key C-b send-prefix

# Give held-key repeats (resize/move/pane nav) a comfortable window.
# Not load-bearing for persistence (see chaining below) but keeps
# the native tmux repeat indicator sane.
set -g repeat-time 1000

# Base index at 1 so tab-number binds (below) line up with what you see.
set -g base-index 1
setw -g pane-base-index 1

# ---------------------------------------------------------------
# General options translated from the Zellij config
# ---------------------------------------------------------------
set -g history-limit 10000          # scroll_buffer_size 10000
set -g mouse on                     # zellij's effective default (mouse_mode not disabled)
set -g set-clipboard on             # copy_on_select — OSC52, works over SSH without xclip
                                     # [INFERENCE] you're on a headless box, so OSC52 (terminal-
                                     # side clipboard) is more likely useful than xclip/wl-copy,
                                     # which need a local X/Wayland session. If you're usually at
                                     # the physical machine instead, swap in a copy-pipe using
                                     # xclip/wl-copy/pbcopy — see the copy-mode block below.
set -g allow-passthrough on         # closest analog to support_kitty_graphics_protocol —
                                     # NOT equivalent, just unblocks terminal passthrough for
                                     # tools (e.g. image previewers) that need it.
set -g extended-keys on             # closest analog to support_kitty_keyboard_protocol
setw -g mode-keys vi                # scroll-mode below uses vi-style h/j/k/l

# Compact, single-line status bar (== default_layout "compact" / simplified_ui)
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-left-length 20
set -g status-right-length 40
set -g status-left  " #S "
set -g status-right " %H:%M "
setw -g window-status-current-format "#[bold] #I:#W #[default]"
setw -g window-status-format " #I:#W "

# Light theme approximation (== theme "pencil-light")
# [INFERENCE] the actual "pencil-light" palette lives in a Zellij themes.kdl
# that wasn't included, so these are generic light-on-dark-ish values, not
# a color-for-color match. Send me the theme's hex codes if you want this exact.
set -g status-style "bg=#e8e8e8,fg=#3a3a3a"
setw -g window-status-current-style "bg=#3a3a3a,fg=#e8e8e8"
setw -g pane-border-style "fg=#c8c8c8"
setw -g pane-active-border-style "fg=#3a3a3a"

set -g pane-border-status off        # pane_frames false
                                      # ("z" in pane-mode below toggles this)

# ---------------------------------------------------------------
# Universal escape hatch: Enter/Escape drop back to root from any
# custom table, mirroring the shared_except "enter"/"esc" rules.
# ---------------------------------------------------------------
bind-key -T zj-pane   Enter  switch-client -T root
bind-key -T zj-pane   Escape switch-client -T root
bind-key -T zj-tab    Enter  switch-client -T root
bind-key -T zj-tab    Escape switch-client -T root
bind-key -T zj-resize Enter  switch-client -T root
bind-key -T zj-resize Escape switch-client -T root
bind-key -T zj-move   Enter  switch-client -T root
bind-key -T zj-move   Escape switch-client -T root
bind-key -T zj-session Enter switch-client -T root
bind-key -T zj-session Escape switch-client -T root

# Optional, faithful-but-destructive: Zellij's Ctrl-d quits the whole
# session from most modes. Uncomment only if you actually want that.
# bind-key -T zj-pane C-d kill-server
# bind-key -T zj-tab  C-d kill-server

# ==================================================================
# PANE mode   (Zellij: Ctrl-g, p, <key>)
# ==================================================================
bind-key p switch-client -T zj-pane

# Persistent navigation — stays in pane mode, like the source config
bind-key -T zj-pane Left  select-pane -L \; switch-client -T zj-pane
bind-key -T zj-pane Down  select-pane -D \; switch-client -T zj-pane
bind-key -T zj-pane Up    select-pane -U \; switch-client -T zj-pane
bind-key -T zj-pane Right select-pane -R \; switch-client -T zj-pane
bind-key -T zj-pane h     select-pane -L \; switch-client -T zj-pane
bind-key -T zj-pane j     select-pane -D \; switch-client -T zj-pane
bind-key -T zj-pane k     select-pane -U \; switch-client -T zj-pane
bind-key -T zj-pane l     select-pane -R \; switch-client -T zj-pane
bind-key -T zj-pane \;    last-pane        \; switch-client -T zj-pane   # FocusLastPane
bind-key -T zj-pane Tab   select-pane -t :.+ \; switch-client -T zj-pane # SwitchFocus

# One-shot actions — run and drop back to root, like "SwitchToMode locked"
bind-key -T zj-pane c command-prompt -I "#T" "select-pane -T '%%'"       # rename pane
bind-key -T zj-pane d split-window -v                                    # new pane down
bind-key -T zj-pane n split-window -v                                    # new pane
bind-key -T zj-pane r split-window -h                                    # new pane right
bind-key -T zj-pane s split-window -v                                    # "stacked" — tmux
                                                                           # has no stacked-pane
                                                                           # layout, approximated
                                                                           # as another v-split
bind-key -T zj-pane x kill-pane                                          # close focus
bind-key -T zj-pane f resize-pane -Z                                     # toggle fullscreen (zoom)
bind-key -T zj-pane e display-popup -E -w 80% -h 80%                     # closest built-in analog
                                                                           # to embed/float toggle —
                                                                           # NOT the same thing (it's
                                                                           # a modal popup, not a
                                                                           # persistent floating pane
                                                                           # you can toggle back into)
bind-key -T zj-pane z if-shell -F '#{==:#{pane-border-status},off}' \
    'set pane-border-status top' 'set pane-border-status off'            # toggle pane frames
# TogglePanePinned / ToggleFloatingPanes have no tmux equivalent (tmux
# has no floating-pane concept) — intentionally left unbound.
bind-key -T zj-pane p switch-client -T root

# ==================================================================
# TAB mode   (Zellij: Ctrl-g, t, <key>)  ==  tmux windows
# ==================================================================
bind-key t switch-client -T zj-tab

bind-key -T zj-tab Left  previous-window \; switch-client -T zj-tab
bind-key -T zj-tab Up    previous-window \; switch-client -T zj-tab
bind-key -T zj-tab Down  next-window     \; switch-client -T zj-tab
bind-key -T zj-tab Right next-window     \; switch-client -T zj-tab
bind-key -T zj-tab h     previous-window \; switch-client -T zj-tab
bind-key -T zj-tab k     previous-window \; switch-client -T zj-tab
bind-key -T zj-tab j     next-window     \; switch-client -T zj-tab
bind-key -T zj-tab l     next-window     \; switch-client -T zj-tab
bind-key -T zj-tab Tab   last-window     \; switch-client -T zj-tab

bind-key -T zj-tab 1 select-window -t 1
bind-key -T zj-tab 2 select-window -t 2
bind-key -T zj-tab 3 select-window -t 3
bind-key -T zj-tab 4 select-window -t 4
bind-key -T zj-tab 5 select-window -t 5
bind-key -T zj-tab 6 select-window -t 6
bind-key -T zj-tab 7 select-window -t 7
bind-key -T zj-tab 8 select-window -t 8
bind-key -T zj-tab 9 select-window -t 9
bind-key -T zj-tab n new-window
bind-key -T zj-tab x kill-window
bind-key -T zj-tab r command-prompt -I "#W" "rename-window '%%'"
bind-key -T zj-tab s setw synchronize-panes                              # ToggleActiveSyncTab
bind-key -T zj-tab b break-pane                                          # BreakPane
bind-key -T zj-tab [ break-pane                                          # tmux has no left/right
bind-key -T zj-tab ] break-pane                                          # variant — approximated
bind-key -T zj-tab t switch-client -T root

# ==================================================================
# RESIZE mode   (Zellij: Ctrl-g, r, <key>)
# ==================================================================
bind-key r switch-client -T zj-resize

bind-key -T zj-resize Left  resize-pane -L 3 \; switch-client -T zj-resize
bind-key -T zj-resize Down  resize-pane -D 3 \; switch-client -T zj-resize
bind-key -T zj-resize Up    resize-pane -U 3 \; switch-client -T zj-resize
bind-key -T zj-resize Right resize-pane -R 3 \; switch-client -T zj-resize
bind-key -T zj-resize h     resize-pane -L 3 \; switch-client -T zj-resize
bind-key -T zj-resize j     resize-pane -D 3 \; switch-client -T zj-resize
bind-key -T zj-resize k     resize-pane -U 3 \; switch-client -T zj-resize
bind-key -T zj-resize l     resize-pane -R 3 \; switch-client -T zj-resize
# Shift+H/J/K/L = "Decrease <dir>" — approximated as growth from the
# opposite edge, since tmux resize-pane doesn't take a signed amount.
bind-key -T zj-resize H resize-pane -R 3 \; switch-client -T zj-resize
bind-key -T zj-resize J resize-pane -U 3 \; switch-client -T zj-resize
bind-key -T zj-resize K resize-pane -D 3 \; switch-client -T zj-resize
bind-key -T zj-resize L resize-pane -L 3 \; switch-client -T zj-resize
bind-key -T zj-resize + resize-pane -R 3 \; resize-pane -D 3 \; switch-client -T zj-resize
bind-key -T zj-resize = resize-pane -R 3 \; resize-pane -D 3 \; switch-client -T zj-resize
bind-key -T zj-resize - resize-pane -L 3 \; resize-pane -U 3 \; switch-client -T zj-resize
bind-key -T zj-resize r switch-client -T root

# ==================================================================
# MOVE mode   (Zellij: Ctrl-g, m, <key>)  ==  swap-pane
# ==================================================================
bind-key m switch-client -T zj-move

bind-key -T zj-move Left  swap-pane -t '{left-of}'  \; switch-client -T zj-move
bind-key -T zj-move Down  swap-pane -t '{down-of}'  \; switch-client -T zj-move
bind-key -T zj-move Up    swap-pane -t '{up-of}'    \; switch-client -T zj-move
bind-key -T zj-move Right swap-pane -t '{right-of}' \; switch-client -T zj-move
bind-key -T zj-move h     swap-pane -t '{left-of}'  \; switch-client -T zj-move
bind-key -T zj-move j     swap-pane -t '{down-of}'  \; switch-client -T zj-move
bind-key -T zj-move k     swap-pane -t '{up-of}'    \; switch-client -T zj-move
bind-key -T zj-move l     swap-pane -t '{right-of}' \; switch-client -T zj-move
bind-key -T zj-move n     swap-pane -D \; switch-client -T zj-move        # MovePane (next)
bind-key -T zj-move Tab   swap-pane -D \; switch-client -T zj-move
bind-key -T zj-move p     swap-pane -U \; switch-client -T zj-move        # MovePaneBackwards
bind-key -T zj-move m     switch-client -T root

# ==================================================================
# SCROLL / SEARCH mode   (Zellij: Ctrl-g, s)  ==  tmux copy-mode
# ==================================================================
# tmux's copy-mode is already a persistent modal state that supports
# repeated hjkl/paging/search without re-pressing prefix — it's a much
# closer native match than building a custom table.
bind-key s copy-mode

bind-key -T copy-mode-vi d send-keys -X halfpage-down                    # HalfPageScrollDown
bind-key -T copy-mode-vi u send-keys -X halfpage-up                      # HalfPageScrollUp
bind-key -T copy-mode-vi s send-keys -X cancel                           # back to "normal"
bind-key -T copy-mode-vi f command-prompt -T search -p "(search down)" \
    "send -X search-forward \"%%%\""                                    # EnterSearch/SearchInput
bind-key -T copy-mode-vi e run-shell "tmux capture-pane -pS -32768 > /tmp/tmux-scrollback.txt \
    && tmux new-window '\$EDITOR /tmp/tmux-scrollback.txt'"              # approximates EditScrollback
# CopyLastCommandOutput / SelectCommandAtScrollPosition rely on Zellij's
# shell-integration prompt markers; tmux has no equivalent without
# OSC133 shell integration wired up separately — left unbound.

# Mouse-drag copy, matching copy_on_select true. Uses OSC52 via
# set-clipboard above; swap the pipe command if you want a local
# clipboard tool instead (xclip -sel clip -i / wl-copy / pbcopy).
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# ==================================================================
# SESSION mode   (Zellij: Ctrl-g, o, <key>)
# ==================================================================
bind-key o switch-client -T zj-session

bind-key -T zj-session d detach-client                                   # Detach
bind-key -T zj-session w choose-tree -Zs                                 # session-manager
bind-key -T zj-session c source-file ~/.tmux.conf \; \
    display-message "tmux.conf reloaded"                                 # configuration
bind-key -T zj-session f resize-pane -Z                                  # closest analog to
                                                                           # ToggleHostFullscreen
bind-key -T zj-session o switch-client -T root
# about / plugin-manager / share / guest-host-session-focus have no
# built-in tmux equivalent:
#  - "plugin manager" -> if you want this, TPM (github.com/tmux-plugins/tpm)
#    is the standard tool, but it's an extra component on top of plain
#    tmux, worth adding deliberately rather than baking in here.
#  - "share" (web sharing) -> tmux has no built-in web server; closest
#    is running this inside something like ttyd/gotty, which is a
#    separate service, not a tmux setting.
#  - guest/host session focus -> tmux's multi-client attach model is
#    different (all attached clients share one view unless you set
#    `aggressive-resize` / separate windows); there's no "focus guest
#    session" action to bind.

# ==================================================================
# Alt+direction quick nav   (Zellij: shared_among normal/locked)
# ==================================================================
# Zellij's Alt+arrows cross from pane to adjacent tab when there's no
# pane in that direction. tmux has no built-in edge-detection to do
# that automatically (that kind of pane<->window crossing normally
# needs a plugin, e.g. tmux-navigator, wired to your editor too) —
# these are mapped as plain pane-focus moves only.
bind-key -n M-Left  select-pane -L
bind-key -n M-Down  select-pane -D
bind-key -n M-Up    select-pane -U
bind-key -n M-Right select-pane -R
bind-key -n M-h     select-pane -L
bind-key -n M-j     select-pane -D
bind-key -n M-k     select-pane -U
bind-key -n M-l     select-pane -R
bind-key -n M-n     split-window -v                                      # Alt+n new pane
bind-key -n M-N     split-window -h                                      # Alt+N new pane
bind-key -n M-i     swap-window -t -1                                    # Alt+i move tab left
bind-key -n M-o     swap-window -t +1                                    # Alt+o move tab right
bind-key -n M-g     display-popup -E -w 80% -h 80%                       # Alt+g floating toggle
bind-key -n M-+     resize-pane -R 3 \; resize-pane -D 3
bind-key -n M--     resize-pane -L 3 \; resize-pane -U 3
bind-key -n M-=     resize-pane -R 3 \; resize-pane -D 3
# Alt+[ / Alt+] (PreviousSwapLayout/NextSwapLayout) — tmux's closest
# equivalent is cycling built-in layouts:
bind-key -n M-\[ select-layout -o
bind-key -n M-\] next-layout
# Alt+p / Alt+Shift+P (pane grouping/marking) have no tmux equivalent
# (tmux has no pane-group concept) — intentionally left unbound.

####################################################################
# End of file
####################################################################
