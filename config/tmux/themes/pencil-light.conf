####################################################################
# pencil-light theme — the palette, as role tokens
####################################################################
#
# A theme is a flat list of role -> colour tokens.  Roles are named by
# *function*, never by hue, so a theme can be swapped without touching
# the core (see README.md).
#
# The colours are taken verbatim from the pencil-light theme.kdl that
# this config was originally written against, mapped by role:
#   #f1f1f1 (241,241,241) theme background -> status-bar base
#   #424242 (66,66,66)    theme text base   -> default status text
#   #b6d6fd (182,214,253) ribbon_selected.emphasis_0 -> light blue accent
#   #008ec4 (0,142,196)   emphasis_3 (blue)  -> session-number block
#   #10a778 (16,167,120)  ribbon_selected.background -> theme's own
#                          "selected/active" color -> active window block
#   #005f87 (0,95,135)    ribbon_unselected.background -> theme's own
#                          "unselected" dark blue -> clock/cpu block
#   #a89c14 (168,156,20)  exit_code_error / player_4 -> theme's own
#                          attention/warning tone -> "yellow" below, since
#                          a pure #ffff00 would clash with this palette
#
# RULE: hex values MUST be lowercase.  On a second format expansion
# tmux rewrites "#D" and "#F" into the pane-id and window-flags aliases
# (format.c format_upper[]), so "#DEADBEEF" would silently become
# "EADBEEF".  Lowercase hex can never collide: 'h' is the only
# lowercase alias and 'h' is not a hex digit.
#
# The value must keep its leading '#': tmux's style parser rejects a
# bare "f1f1f1" (colour.c colour_fromstring() requires the '#').

# --- Colour roles --------------------------------------------------
set -g @c_bg      "#f1f1f1"   # status bar base
set -g @c_fg      "#424242"   # default status text
set -g @c_active  "#10a778"   # active window block
set -g @c_idle    "#005f87"   # inactive / clock block
set -g @c_warn    "#a89c14"   # attention / active mode
set -g @c_accent  "#b6d6fd"   # light blue accent
set -g @c_sel     "#008ec4"   # selected / session number

# --- Glyphs (Nerd Font) --------------------------------------------
# Kept as tokens so a font that renders them differently (or not at
# all) only needs one edit.
set -g @icon_tmux  ""     # nf-oct-terminal (U+F489) - session/tmux icon
set -g @icon_cpu   ""     # nf-fa-microchip (U+F2DB) - cpu icon
set -g @icon_clock ""     # nf-fa-clock     (U+F017) - clock icon
set -g @icon_zoom  ""     # Unicode magnifying glass - zoomed-window marker

# Powerline separator glyph (U+E0B0, solid right-pointing triangle).
# Rule used throughout: the separator is drawn with fg = the color of
# the block it's leaving, bg = the color of the block it's entering -
# that's what makes one block appear to "flow into" the next.
# NOTE: the value is empty, and was empty in tmux.conf too, so the
# separator is currently not drawn.  Set it to "" to turn it on;
# it is left as-is here so that modularising the config does not
# change what the bar looks like.
set -g @sep        ""
