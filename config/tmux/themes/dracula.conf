####################################################################
# dracula theme — a second palette, proving the swap
####################################################################
#
# Same role tokens as pencil-light.conf, different colours.  Selecting
# it is a one-line change in tmux.conf's %if chain (or by exporting
# TMUX_THEME=dracula before starting tmux).
#
# RULE: hex values MUST be lowercase.  On a second format expansion
# tmux rewrites "#D" and "#F" into the pane-id and window-flags aliases
# (format.c format_upper[]), so "#DEADBEEF" would silently become
# "EADBEEF".  Lowercase hex can never collide: 'h' is the only
# lowercase alias and 'h' is not a hex digit.
#
# The value must keep its leading '#': tmux's style parser rejects a
# bare "f1f1f1" (colour.c colour_fromstring() requires the '#').

# --- Colour roles --------------------------------------------------
set -g @c_bg      "#282a36"   # status bar base
set -g @c_fg      "#f8f8f2"   # default status text
set -g @c_active  "#50fa7b"   # active window block
set -g @c_idle    "#6272a4"   # inactive / clock block
set -g @c_warn    "#ffb86c"   # attention / active mode
set -g @c_accent  "#bd93f9"   # purple accent
set -g @c_sel     "#8be9fd"   # selected / session number

# --- Glyphs (Nerd Font) --------------------------------------------
# Same glyphs as pencil-light: the font, not the theme, decides which
# characters render.
set -g @icon_tmux  ""     # nf-oct-terminal (U+F489) - session/tmux icon
set -g @icon_cpu   ""     # nf-fa-microchip (U+F2DB) - cpu icon
set -g @icon_clock ""     # nf-fa-clock     (U+F017) - clock icon
set -g @icon_zoom  ""     # Unicode magnifying glass - zoomed-window marker

# Powerline separator glyph (U+E0B0, solid right-pointing triangle).
# Empty here too, to match pencil-light: the separator is not drawn.
set -g @sep        ""
