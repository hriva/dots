####################################################################
# status/right.conf — the right (cpu | clock) segment of the status bar
####################################################################
#
# A segment is a token whose value is the whole styled fragment.  The
# core only decides *where* a segment goes; this file owns *what* it
# contains.  Swap this file for a variant (right-macos.conf) and the
# bar changes without the core knowing.
#
# The token is consumed with a double expansion ("#{E:@seg_right}") so
# that the colour references inside it resolve.  A single expansion
# would leave "#{@c_idle}" literal.
#
# The CPU reading needs no plugin - just iostat(1) (procps), already on
# any stock Ubuntu server install.  It is refreshed every
# status-interval.

# --- Right side: [ cpu% | H:M ] in one dark-blue block ---------------
set -g @seg_right \
"#[fg=#{@c_idle},bg=#{@c_bg}]#{@sep}\
#[fg=#{@c_bg},bg=#{@c_idle}] #{@icon_cpu} #(iostat -c 1 2 | awk '$1 ~ /^[0-9.]+/ {u=\$1; s=\$3} END {printf \"%.1f\", u+s}')%% #{@icon_clock} %H:%M "
