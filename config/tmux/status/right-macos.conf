####################################################################
# status/right-macos.conf — right segment variant for macOS
####################################################################
#
# Same segment as right.conf, different CPU command: macOS has no
# iostat(1), it has top(1) with a different output format.  The
# segment model is what makes this possible - the metric is part of
# the segment, not part of the core.
#
# Include this file *instead of* status/right.conf to use it.

# --- Right side: [ cpu% | H:M ] in one dark-blue block ---------------
set -g @seg_right \
"#[fg=#{@c_idle},bg=#{@c_bg}]#{@sep}\
#[fg=#{@c_bg},bg=#{@c_idle}] #{@icon_cpu} #(top -l 1 -n 0 | awk '/CPU usage/ {print $3+$5}')%% #{@icon_clock} %H:%M "
