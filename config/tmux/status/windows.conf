####################################################################
# status/windows.conf — the window-list segments of the status bar
####################################################################
#
# Two segments live here because they are two different fragments: the
# plain entry for every inactive window, and the green "pill" for the
# active one.
#
# The tokens are consumed with a double expansion ("#{E:@seg_window}")
# so that the colour references inside them resolve.  A single
# expansion would leave "#{@c_active}" literal.

# --- Window list: plain text, active window gets a green pill --------
set -g @seg_window " #I:#W #{?window_zoomed_flag,#{@icon_zoom},} "

set -g @seg_window_current \
"#[fg=#{@c_bg},bg=#{@c_active}]#{@sep}\
#[fg=#{@c_bg},bg=#{@c_active},bold] #I:#W #{?window_zoomed_flag,#{@icon_zoom},} \
#[fg=#{@c_active},bg=#{@c_bg}]#{@sep}#[fg=default,bg=default]"
