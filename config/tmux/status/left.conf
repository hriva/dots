####################################################################
# status/left.conf — the left (session) segment of the status bar
####################################################################
#
# A segment is a token whose value is the whole styled fragment.  The
# core only decides *where* a segment goes; this file owns *what* it
# contains.  Swap this file for a variant and the bar changes without
# the core knowing.
#
# The token is consumed with a double expansion ("#{E:@seg_left}") so
# that the colour references inside it resolve.  A single expansion
# would leave "#{@c_warn}" literal.

# Live mode indicator: the colour reflects the current mode - theme
# yellow the instant the prefix is held OR you're inside any zj-*
# submode, dark blue while sitting in the root table (Zellij's
# "locked" equivalent).
#
# The *condition* here is core behaviour: it reads live client state
# (client_prefix, client_key_table), which only the mode tables know
# about.  The *colours* it selects are the theme's.  Splitting it this
# way keeps the logic in one place and the palette swappable.
set -g @mode_indicator_fg \
"#{?#{||:#{client_prefix},#{!=:#{client_key_table},root}},#{@c_warn},#{@c_idle}}"

# --- Session: plain bold text, color reflects the current mode ------
set -g @seg_left \
"#[fg=#{E:@mode_indicator_fg},bold] #{@icon_tmux} #S #[default]"
