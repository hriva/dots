#
# tuned configuration
#

[main]
summary=Optimize for low power consumption

[cpu]
governor=schedutil|conservative|powersave
energy_perf_bias=powersave|power
energy_performance_preference=power
boost=0

[acpi]
platform_profile=low-power|quiet

[eeepc_she]

[vm]

[audio]
timeout=1

[video]
radeon_powersave=dpm-battery, auto
panel_power_savings=3

[disk]
# Comma separated list of devices, all devices if commented out.
# devices=sda

[net]
# Comma separated list of devices, all devices if commented out.
# devices=eth0

[scsi_host]
alpm=med_power_with_dipm

[sysctl]
vm.laptop_mode=5
vm.dirty_writeback_centisecs=1500
vm.swappiness=85
kernel.nmi_watchdog=0

[script]
script=${i:PROFILE_DIR}/script.sh

[sysfs]
# ssd
/sys/bus/pci/devices/0000:61:00.0/power/control=auto
# mediatek
/sys/bus/pci/devices/0000:63:00.0/power/control=auto
#igpu
/sys/bus/pci/devices/0000:65:00.0/power/control=auto
#npu
/sys/bus/pci/devices/0000:66:00.1/power/control=auto
