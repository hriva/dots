#
# tuned configuration
#

[main]
summary=General non-specialized tuned profile

[modules]
cpufreq_conservative=+r

[cpu]
priority=10
governor=schedutil|ondemand|powersave
energy_perf_bias=normal
energy_performance_preference=balance_performance
boost=1

[acpi]
platform_profile=balanced

[audio]
timeout=10

[video]
radeon_powersave=dpm-balanced, auto
panel_power_savings=0

[disk]
# Comma separated list of devices, all devices if commented out.
# devices=sda

[scsi_host]
alpm=med_power_with_dipm

[sysfs]
# ssd
/sys/bus/pci/devices/0000:61:00.0/power/control=auto
# mediatek
/sys/bus/pci/devices/0000:63:00.0/power/control=on
#igpu
/sys/bus/pci/devices/0000:65:00.0/power/control=on
#npu
/sys/bus/pci/devices/0000:66:00.1/power/control=on
